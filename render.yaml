# Render Blueprint: API (Docker) + UI (static site) + PostgreSQL, all on free plans.
# Create it from the Render dashboard: New > Blueprint > pick this repository.
# Render asks for the two `sync: false` values on first creation; see README section 5a.
databases:
  - name: rental-desk-db
    plan: free
    databaseName: rental_desk
    user: rental_desk

services:
  - type: web
    name: rental-desk-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rental-desk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # the UI's URL, e.g. https://rental-desk-ui.onrender.com
      - key: ALLOW_TEST_CLOCK
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: rental-desk-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # the API's URL, e.g. https://rental-desk-api.onrender.com
